---
- name: ZooKeeper aus Nexus-Mirror installieren und als User-Unit starten
  hosts: zookeeper
  serial: 1
  any_errors_fatal: true
  gather_facts: false

  vars:
    # Defaults - pro Environment in inventory/<env>/group_vars/all.yml überschreibbar
    zookeeper_version: "{{ zookeeper_version | default('3.9.2') }}"
    # URL des Nexus/Artifactory-Mirrors für apache-zookeeper-<version>-bin.tar.gz.
    # Muss pro Environment gesetzt werden, es gibt bewusst keinen Default.
    zookeeper_mirror_url: "{{ zookeeper_mirror_url | default('') }}"
    zookeeper_install_dir: "{{ zookeeper_install_dir | default('/opt/zookeeper') }}"
    zookeeper_data_dir: "{{ zookeeper_data_dir | default(zookeeper_install_dir + '/data') }}"
    zookeeper_config_path: "{{ zookeeper_install_dir + '/conf/zoo.cfg' }}"
    zookeeper_jaas_conf_path: "{{ zookeeper_install_dir + '/conf/zookeeper_jaas.conf' }}"
    # User, unter dem die systemd User-Unit läuft. Default: der SSH-Login-User.
    zookeeper_service_user: "{{ zookeeper_service_user | default(ansible_user) }}"
    zookeeper_java_home: "{{ zookeeper_java_home | default('/usr/lib/jvm/jre-17-openjdk') }}"
    zookeeper_client_port: "{{ zookeeper_client_port | default(2181) }}"
    zookeeper_secure_client_port: "{{ zookeeper_secure_client_port | default(2182) }}"
    zookeeper_tls_enabled: "{{ zookeeper_tls_enabled | default(true) }}"
    zookeeper_sasl_enabled: "{{ zookeeper_sasl_enabled | default(true) }}"
    zookeeper_kafka_sasl_username: "{{ zookeeper_kafka_sasl_username | default('kafka') }}"
    zookeeper_health_check_timeout: "{{ zookeeper_health_check_timeout | default(60) }}"

  tasks:
    - name: Prüfen, dass zookeeper_mirror_url gesetzt ist
      ansible.builtin.assert:
        that:
          - zookeeper_mirror_url | length > 0
        fail_msg: >-
          zookeeper_mirror_url ist nicht gesetzt. Bitte in
          inventory/<env>/group_vars/all.yml die URL des Nexus/Artifactory-Mirrors
          für apache-zookeeper-{{ zookeeper_version }}-bin.tar.gz hinterlegen.

    - name: Prüfen, dass zookeeper_id für diesen Host gesetzt ist
      ansible.builtin.assert:
        that:
          - zookeeper_id is defined
        fail_msg: >-
          zookeeper_id ist für {{ inventory_hostname }} nicht gesetzt. Bitte als
          Host-Variable in inventory/<env>/hosts.ini ergänzen (siehe [zookeeper]-Gruppe).

    - name: SASL-User-Dict für die JAAS-Config zusammenstellen
      ansible.builtin.set_fact:
        zookeeper_sasl_users: "{{ {zookeeper_kafka_sasl_username: zookeeper_kafka_sasl_password} }}"
      no_log: true
      when: zookeeper_sasl_enabled | bool

    - name: Passwd-Eintrag ermitteln (Home-Verzeichnis, UID) für {{ zookeeper_service_user }}
      ansible.builtin.getent:
        database: passwd
        key: "{{ zookeeper_service_user }}"

    - name: Home-Verzeichnis und UID als Facts setzen
      ansible.builtin.set_fact:
        zookeeper_home: "{{ getent_passwd[zookeeper_service_user][4] }}"
        zookeeper_uid: "{{ getent_passwd[zookeeper_service_user][1] }}"

    - name: Installationsverzeichnis anlegen unter {{ zookeeper_install_dir }}
      become: true
      ansible.builtin.file:
        path: "{{ zookeeper_install_dir }}"
        state: directory
        owner: "{{ zookeeper_service_user }}"
        group: "{{ zookeeper_service_user }}"
        mode: "0755"

    - name: Datenverzeichnis (dataDir) anlegen unter {{ zookeeper_data_dir }}
      become: true
      ansible.builtin.file:
        path: "{{ zookeeper_data_dir }}"
        state: directory
        owner: "{{ zookeeper_service_user }}"
        group: "{{ zookeeper_service_user }}"
        mode: "0750"

    - name: ZooKeeper-Archiv vom Mirror herunterladen und entpacken nach {{ zookeeper_install_dir }}
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.unarchive:
        src: "{{ zookeeper_mirror_url }}"
        dest: "{{ zookeeper_install_dir }}"
        remote_src: true
        extra_opts:
          - "--strip-components=1"
        mode: "0755"
      notify: ZooKeeper neu starten

    - name: myid schreiben ({{ zookeeper_id }})
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.template:
        src: "templates/zookeeper/myid.j2"
        dest: "{{ zookeeper_data_dir }}/myid"
        mode: "0640"
      notify: ZooKeeper neu starten

    - name: zookeeper_jaas.conf rendern (SASL-User für eingehende Kafka-Verbindungen)
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.template:
        src: "templates/zookeeper/zookeeper_jaas.conf.j2"
        dest: "{{ zookeeper_jaas_conf_path }}"
        mode: "0640"
      no_log: true
      notify: ZooKeeper neu starten
      when: zookeeper_sasl_enabled | bool

    - name: zoo.cfg rendern nach {{ zookeeper_config_path }}
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.template:
        src: "templates/zookeeper/zookeeper.properties.j2"
        dest: "{{ zookeeper_config_path }}"
        mode: "0640"
      notify: ZooKeeper neu starten

    - name: Lingering aktivieren für {{ zookeeper_service_user }}
      become: true
      ansible.builtin.command:
        cmd: "loginctl enable-linger {{ zookeeper_service_user }}"
      register: zookeeper_linger
      changed_when: "'Cannot' not in (zookeeper_linger.stderr | default(''))"

    - name: Verzeichnis für systemd User-Units anlegen
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.file:
        path: "{{ zookeeper_home }}/.config/systemd/user"
        state: directory
        mode: "0755"

    - name: ZooKeeper User-Unit rendern
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.template:
        src: "templates/zookeeper/zookeeper.service.j2"
        dest: "{{ zookeeper_home }}/.config/systemd/user/zookeeper.service"
        mode: "0644"
      notify: ZooKeeper neu starten

    - name: ZooKeeper User-Service aktivieren und starten
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.systemd:
        name: zookeeper.service
        scope: user
        daemon_reload: true
        enabled: true
        state: started
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ zookeeper_uid }}"

    - name: Auf ZooKeeper-Client-Port warten (Health-Check)
      ansible.builtin.wait_for:
        port: "{{ zookeeper_secure_client_port if (zookeeper_tls_enabled | bool) else zookeeper_client_port }}"
        host: "{{ ansible_host | default(inventory_hostname) }}"
        timeout: "{{ zookeeper_health_check_timeout }}"

  handlers:
    - name: ZooKeeper neu starten
      become: true
      become_user: "{{ zookeeper_service_user }}"
      ansible.builtin.systemd:
        name: zookeeper.service
        scope: user
        daemon_reload: true
        state: restarted
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ zookeeper_uid }}"
