---
env_name: prod

#####################################################################################
# Nexus/Artifactory-Mirror-URLs (Pflicht, kein Default - Playbooks brechen ohne
# diese Werte mit assert ab). Zeigen auf die Original-Apache-Binary-Distributionen,
# nur ueber den internen Mirror gespiegelt.
#####################################################################################
kafka_version: "3.7.2"
kafka_scala_version: "2.13"
kafka_mirror_url: "https://nexus.example.local/repository/generic-hosted/kafka/kafka_2.13-3.7.2.tgz"

zookeeper_version: "3.9.2"
zookeeper_mirror_url: "https://nexus.example.local/repository/generic-hosted/zookeeper/apache-zookeeper-3.9.2-bin.tar.gz"

#####################################################################################
# Install-Pfade / Java (RedHat: ueblicherweise /usr/lib/jvm/... - java -version bzw.
# alternatives --list auf der VM pruefen und ggf. anpassen).
#####################################################################################
kafka_install_dir: /opt/kafka
kafka_java_home: /usr/lib/jvm/jre-17-openjdk

zookeeper_install_dir: /opt/zookeeper
zookeeper_java_home: /usr/lib/jvm/jre-17-openjdk

#####################################################################################
# TLS - Keystore/Truststore muessen bereits auf den VMs liegen (werden von diesen
# Playbooks NICHT erzeugt/verteilt, siehe README.md). Passwoerter hier NIEMALS im
# Klartext committen - stattdessen ansible-vault verwenden, z. B.:
#   ansible-vault encrypt_string 'geheim' --name 'kafka_ssl_keystore_password'
#####################################################################################
kafka_ssl_keystore_location: /etc/kafka/ssl/kafka.keystore.jks
kafka_ssl_keystore_password: "CHANGE-ME"
kafka_ssl_key_password: "CHANGE-ME"
kafka_ssl_truststore_location: /etc/kafka/ssl/kafka.truststore.jks
kafka_ssl_truststore_password: "CHANGE-ME"
kafka_ssl_client_auth: required

zookeeper_tls_enabled: true
zookeeper_ssl_keystore_location: /etc/zookeeper/ssl/zookeeper.keystore.jks
zookeeper_ssl_keystore_password: "CHANGE-ME"
zookeeper_ssl_truststore_location: /etc/zookeeper/ssl/zookeeper.truststore.jks
zookeeper_ssl_truststore_password: "CHANGE-ME"
zookeeper_ssl_client_auth: need

#####################################################################################
# SASL/PLAIN - analog zu kafka_server_jaas.conf in kafka-config bzw.
# secrets/kafka_server_jaas.conf in kafka_mirror. Passwoerter ebenfalls per
# ansible-vault verschluesseln.
#####################################################################################
kafka_sasl_mechanism: PLAIN
kafka_inter_broker_username: admin
kafka_inter_broker_password: "CHANGE-ME"
# Weitere Client-User (Producer/Consumer/Monitoring); Format wie in kafka-config/files/kafka_server_jaas.conf
kafka_jaas_users:
  monitoring: "CHANGE-ME"
  client: "CHANGE-ME"
kafka_super_users: "User:admin"

zookeeper_sasl_enabled: true
# User, mit dem sich der Kafka-Broker (Client{}-Block in kafka_server_jaas.conf)
# gegenueber ZooKeeper authentifiziert - muss zu zookeeper_sasl_users passen.
zookeeper_kafka_sasl_username: kafka
zookeeper_kafka_sasl_password: "CHANGE-ME"

#####################################################################################
# Kafka-Cluster-Tuning (Defaults in install-kafka.yml, hier nur bei Bedarf ueberschreiben)
#####################################################################################
kafka_num_partitions: 6
kafka_default_replication_factor: 3
kafka_min_insync_replicas: 2
kafka_log_retention_hours: 168
